name: Problem report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: rPlayFling version
      placeholder: "2.1 (21)"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: iPhone model and iOS version
      placeholder: "iPhone 13, iOS 27.0"
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car or head unit
      placeholder: "2024 VW Tiguan, CarPlay wireless / aftermarket head unit model"
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Casting from the browser to the car
        - Web tab on the car
        - DLNA (another app casting to rPlayFling)
        - Photos & Videos
        - Cast Screen
        - TV (AirPlay / Chromecast / DLNA)
        - Other
  - type: textarea
    id: more
    attributes:
      label: Screenshots, the site or video, anything else
